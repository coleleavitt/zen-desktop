# Zen Desktop Workflow Feature Module Addition Or Extension

## Action

Follow the feature-module-addition-or-extension workflow:
1. Update or create relevant preference YAML files under prefs/zen/
2. Add or modify source implementation files in a dedicated module directory under src/zen/
3. Add or update interface definition files (.idl) for new APIs or system interfaces
4. Add or update build configuration files (moz.build, components.conf) for the module
5. Add platform-specific implementation files as needed (e.g., .cpp, .mm, .h)
6. Update or create test files and test build configs under src/zen/tests/
7. Update the top-level src/zen/moz.build to include the new/changed module

## Evidence

- Workflow detected from commit patterns
- Frequency: ~2x per month
- Files: prefs/zen/*.yaml, src/zen/<module>/*.mjs, src/zen/<module>/*.cpp

